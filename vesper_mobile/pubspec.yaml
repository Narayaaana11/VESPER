name: vesper_mobile
description: "VESPER Mobile - Wispr Flow Ambient Intelligence & Local-First Speech-to-Action for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

  # Audio & Speech Recognition
  speech_to_text: ^7.0.0

  # System & Device Integrations
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_overlay_window: ^0.5.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
